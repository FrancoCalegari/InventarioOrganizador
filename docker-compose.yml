services:
  web:
    build: .
    container_name: inventario-web
    command: ["node", "server.js"]
    ports:
      - "${PORT:-3000}:3000"
    environment: &env
      PORT: "3000"
      SESSION_SECRET: "${SESSION_SECRET:-inv-local-secret-key-2026}"
      DATA_DIR: "/app/data"
      BUCKET_DIR: "/app/storage/buckets/items"
    volumes: &vols
      - ./data:/app/data
      - ./storage/buckets/items:/app/storage/buckets/items
    restart: unless-stopped

  worker:
    build: .
    container_name: inventario-worker
    command: ["node", "worker.js"]
    environment: *env
    volumes: *vols
    cpus: 1.0
    mem_limit: 768m
    stop_grace_period: 60s
    restart: unless-stopped
